<!doctype html>
<html><head><meta charset="utf-8"><title>TSL smoke test</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js", "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js", "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.tsl.js" } }
</script></head><body><pre id="out">running</pre>
<script type="module">
import * as THREE from 'three/webgpu';
import { Fn, If, Loop, Break, array, storage, instanceIndex, uint, float, vec4 } from 'three/tsl';
const out = document.getElementById( 'out' );
const publish = ( r ) => { window.__gpuTest = { done: true, ...r }; out.textContent = JSON.stringify( r, null, 2 ); };
try {
	const renderer = new THREE.WebGPURenderer( { antialias: false } );
	await renderer.init();
	if ( ! renderer.backend.isWebGPUBackend ) throw new Error( 'no WebGPU backend' );
	const N = 64;
	const buf = new THREE.StorageBufferAttribute( new Uint32Array( N ), 1 );
	const node = storage( buf, 'uint', N );
	// a local array used as a stack, a loop with a data-dependent break, pushes and pops
	const kernel = Fn( () => {
		const id = instanceIndex;
		If( id.lessThan( uint( N ) ), () => {
			const stack = array( 'uint', 16 ).toVar();
			const sp = uint( 0 ).toVar();
			const acc = uint( 0 ).toVar();
			// push id, id+1, id+2
			stack.element( sp ).assign( id ); sp.addAssign( uint( 1 ) );
			stack.element( sp ).assign( id.add( uint( 1 ) ) ); sp.addAssign( uint( 1 ) );
			stack.element( sp ).assign( id.add( uint( 2 ) ) ); sp.addAssign( uint( 1 ) );
			Loop( { start: uint( 0 ), end: uint( 100 ), type: 'uint', condition: '<' }, () => {
				If( sp.equal( uint( 0 ) ), () => { Break(); } );
				sp.subAssign( uint( 1 ) );
				acc.addAssign( stack.element( sp ) );
			} );
			node.element( id ).assign( acc );
		} );
	} )().compute( N, [ 64 ] );
	renderer.compute( kernel );
	const data = new Uint32Array( await renderer.getArrayBufferAsync( buf ) );
	let ok = true;
	for ( let i = 0; i < N; i ++ ) if ( data[ i ] !== 3 * i + 3 ) ok = false;
	publish( { ok, sample: Array.from( data.slice( 0, 4 ) ) } );
} catch ( e ) { publish( { ok: false, error: String( e.stack || e ) } ); }
</script></body></html>
